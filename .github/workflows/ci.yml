name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERTA_SKIP_MIGRATIONS: "1"
      DATABASE_URL: ""
      DEPLOYER_PRIVATE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT: "1"
      DATABASE_URL: ""
      CERTA_SKIP_MIGRATIONS: "1"
      DEPLOYER_PRIVATE_KEY: ""
      DEMO_SEED: "true"
      DEMO_MODE: "1"
      TELEGRAM_BOT_TOKEN: "123:playwright-demo"
      SESSION_SECRET: playwright-session-secret-32chars
      APP_ENCRYPTION_KEY: playwright-demo-encryption-key-32b
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @certa/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            playwright-report
            test-results
          if-no-files-found: ignore

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bash scripts/setup-contracts.sh
      - run: forge test --root contracts
